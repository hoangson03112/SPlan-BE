name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  IMAGE_NAME: postgres:16

jobs:

  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' 

      - name: Install Dependencies
        run: npm ci

      - name: Run Jest Tests
        run: npm test


  build-and-push:
    name: Build & Push Docker Image
    needs: test # CHỈ CHẠY khi Job Test thành công!
    runs-on: ubuntu-latest
    
    # Chỉ push image khi có event PUSH vào nhánh main (Bỏ qua khi tạo Pull Request)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Khởi tạo QEMU để hỗ trợ build multi-platform (nếu cần)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Khởi tạo Docker Buildx để tăng tốc build và tận dụng Cache
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Đăng nhập vào Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Trích xuất Metadata (Tự tạo các Tags chuẩn như :latest, :main-sha)
      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=,format=short

      # Build và Push Image lên Docker Hub
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Tận dụng GitHub Actions Cache để lần build sau cực nhanh
          cache-from: type=gha
          cache-to: type=gha,mode=max