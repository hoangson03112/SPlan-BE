version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: jira_postgres
    restart: always
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: jira_admin
      POSTGRES_PASSWORD: super_secret_password
      POSTGRES_DB: jira_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
